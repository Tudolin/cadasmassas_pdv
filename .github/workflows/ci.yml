# Lint + testes a cada push na main e em todo pull request.
#
# Nao ha build de imagem: o PDV roda como processo Python nativo no notebook
# da loja, sem Docker (requisito do projeto).
#
# Roda no ubuntu de proposito, apesar de o destino ser Windows: garante que
# nada de essencial dependa de pywin32. O `pdv/impressao.py` importa
# win32print de forma tardia justamente para isso -- se alguem mover esse
# import para o topo do arquivo, este CI quebra e avisa.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo cancela o CI do anterior no mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parser:
    # Job separado e proposital: o parser de codigo de barras e o unico ponto
    # onde um bug cobra dinheiro errado do cliente. Um job dedicado deixa
    # obvio no PR se foi ele que quebrou, sem procurar dentro de outro log.
    name: Parser de codigo de barras (etiquetas reais)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar pytest
        run: pip install pytest

      # Sem instalar Flask nem nada: o parser precisa continuar puro. Se
      # alguem fizer `codigo_barras.py` importar o mundo, este passo quebra.
      - name: Testes do parser (sem dependencias)
        run: pytest tests/test_codigo_barras.py -v

  testes:
    name: Lint e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 e o minimo declarado; 3.13 e o que esta na maquina da loja.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatacao (ruff format)
        run: ruff format --check .

      - name: Testes
        run: pytest -q

      - name: Doctests dos modulos puros
        run: >
          pytest --doctest-modules -q
          pdv/dinheiro.py pdv/codigo_barras.py pdv/importador.py

  scripts:
    name: Sintaxe dos scripts PowerShell
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Nao executa os scripts (eles mexem em git, venv e Agendador de
      # Tarefas) -- so confere que o PowerShell consegue interpretar. Erro de
      # digitacao em .ps1 so aparece na hora de rodar, e a hora de rodar e o
      # logon da loja.
      - name: Conferir sintaxe
        shell: pwsh
        run: |
          $erros = 0
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $conteudo = Get-Content $_.FullName -Raw
            $problemas = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $conteudo, [ref]$null, [ref]$problemas) | Out-Null
            if ($problemas.Count -gt 0) {
              Write-Host "FALHA: $($_.Name)" -ForegroundColor Red
              $problemas | ForEach-Object { Write-Host "  $($_.Message)" }
              $erros++
            } else {
              Write-Host "ok: $($_.Name)"
            }
          }
          if ($erros -gt 0) { exit 1 }
